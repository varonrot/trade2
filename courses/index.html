<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade2 | מרכז הלמידה</title>
<meta name="description" content="Trade2 — מרכז הלמידה למסחר והשקעות בשוק ההון.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="courses.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-avatar" src="https://i.pravatar.cc/80?img=47" alt="משתמש">
      <button class="icon-btn apps-btn" aria-label="אפליקציות"><span class="dot-grid" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span></button>
      <button class="icon-btn notification-btn" aria-label="התראות"><span class="bell-icon">●</span><span class="notif-count">1</span></button>
      <button class="icon-btn cart-btn" aria-label="עגלה">🛒</button>
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="החלפת מצב תצוגה">☾</button>
    </div>

    <div class="topbar-center">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="globalSearch" type="search" placeholder="חיפוש קורסים, שיעורים או נושאים...">
        <span class="search-shortcut">Ctrl + K</span>
      </div>
    </div>

    <div class="topbar-right">
      <a href="/index2.html" class="brand" aria-label="Trade2">
        <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-text">TRADE<b>2</b></span>
      </a>
      <button class="menu-btn" aria-label="תפריט"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="page-canvas" aria-label="תוכן ייבנה כאן"></main>

<script>
const themeToggle=document.getElementById('themeToggle');
const search=document.getElementById('globalSearch');
const savedTheme=localStorage.getItem('trade2-theme');
if(savedTheme==='light'){document.body.classList.add('light-mode');themeToggle.textContent='☀';}
themeToggle.addEventListener('click',()=>{
  document.body.classList.toggle('light-mode');
  const light=document.body.classList.contains('light-mode');
  themeToggle.textContent=light?'☀':'☾';
  localStorage.setItem('trade2-theme',light?'light':'dark');
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();
    search.focus();
  }
});
</script>
</body>
</html>
