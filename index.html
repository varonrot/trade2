<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade2 — מסלול הלמידה שלי</title>
  <meta name="description" content="דשבורד הלמידה של Trade2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="ניווט ראשי">
      <div class="brand-box">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M5 18.4 24 8l19 10.4L24 28.8 5 18.4Z" fill="url(#capg)"/>
            <path d="M13.2 23.3v8.2c0 3.8 5 7 10.8 7s10.8-3.2 10.8-7v-8.2L24 29.1 13.2 23.3Z" fill="#079CFF"/>
            <path d="M42.8 18.6v11.2" stroke="#19C6FF" stroke-width="2.3" stroke-linecap="round"/>
            <defs><linearGradient id="capg" x1="5" y1="8" x2="43" y2="28.8"><stop stop-color="#00C8FF"/><stop offset="1" stop-color="#2456FF"/></linearGradient></defs>
          </svg>
        </div>
        <div class="brand-copy">
          <strong>מסלול שלי</strong>
          <span>לומדים היום, מצליחים מחר</span>
        </div>
      </div>

      <nav class="side-nav">
        <div class="nav-section-label">ראשי</div>
        <a class="nav-item active" href="/" aria-current="page">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7V21h-6v-6H9v6H3V10.7Z"/></svg></span>
          <span>בית</span>
        </a>
        <a class="nav-item" href="/courses/">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.5c3.4-.9 5.8-.2 8 1.7v12c-2.2-1.9-4.6-2.6-8-1.7v-12Zm16 0c-3.4-.9-5.8-.2-8 1.7v12c2.2-1.9 4.6-2.6 8-1.7v-12Z"/></svg></span>
          <span>הקורסים שלי</span>
        </a>
        <a class="nav-item" href="/courses/">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span>
          <span>דשבורד</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7 3v4M17 3v4M4 10h16"/></svg></span>
          <span>לוח שיעורים</span>
        </a>

        <div class="nav-section-label progress-label">התקדמות</div>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 20v-7M12 20V6M19 20v-11"/></svg></span>
          <span>דוחות התקדמות</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 4h8v3.5A4 4 0 0 1 12 12a4 4 0 0 1-4-4.5V4Z"/><path d="M8 6H4v1.5A4.5 4.5 0 0 0 8.5 12M16 6h4v1.5A4.5 4.5 0 0 1 15.5 12M12 12v5M8.5 21h7M10 17h4"/></svg></span>
          <span>הישגים ותעודות</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2.5 20c.5-4 2.5-6 5.5-6s5 2 5.5 6M10.5 20c.5-4 2.5-6 5.5-6s5 2 5.5 6"/></svg></span>
          <span>קהילה</span>
        </a>

        <div class="nav-section-label tools-label">כלים נוספים</div>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5a7.5 7.5 0 0 0 0-3l2-1.5-2-3.5-2.4 1A8 8 0 0 0 14 5l-.4-2.5h-4L9 5a8 8 0 0 0-2.6 1.5l-2.4-1L2 9l2 1.5a7.5 7.5 0 0 0 0 3L2 15l2 3.5 2.4-1A8 8 0 0 0 9 19l.6 2.5h4L14 19a8 8 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5Z"/></svg></span>
          <span>הגדרות</span>
        </a>
        <a class="nav-item" href="#">
          <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.8 2c-1 .7-1.6 1.1-1.6 2.5M12 17h.01"/></svg></span>
          <span>עזרה</span>
        </a>
      </nav>

      <div class="sidebar-promo">
        <div class="promo-book" aria-hidden="true">
          <svg viewBox="0 0 70 70"><path d="M35 17c-7-5-15-5-23-2v34c8-3 16-3 23 3V17Zm0 0c7-5 15-5 23-2v34c-8-3-16-3-23 3V17Z"/></svg>
        </div>
        <strong>למידה ללא גבולות</strong>
        <span>הידע שלך</span>
        <span>העתיד שלך</span>
        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div class="search-wrap" dir="rtl">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input type="search" placeholder="חיפוש קורסים, שיעורים או נושאים..." aria-label="חיפוש" />
        </div>

        <div class="top-actions">
          <button class="icon-button" aria-label="מצב כהה">
            <svg viewBox="0 0 24 24"><path d="M20 15.2A8 8 0 0 1 8.8 4a8.2 8.2 0 1 0 11.2 11.2Z"/></svg>
          </button>
          <button class="icon-button notification" aria-label="התראות">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <i></i>
          </button>
          <span class="top-divider"></span>
          <div class="student-meta">
            <strong>דניאל כהן</strong>
            <span>תלמיד/ה</span>
          </div>
          <div class="avatar" aria-hidden="true">ד</div>
          <button class="chevron" aria-label="תפריט משתמש">⌄</button>
        </div>
      </header>

      <main class="blank-canvas" aria-label="אזור תוכן">
        <div class="orb orb-top"></div>
        <div class="orb orb-bottom"></div>
      </main>
    </section>
  </div>
</body>
</html>
