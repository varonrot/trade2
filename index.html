<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade2 Dashboard Shell</title>
  <meta name="description" content="Dashboard shell for Trade2 learning platform" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="sidebar-separators.css" />
  <link rel="stylesheet" href="mobile-hamburger.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute;opacity:0;pointer-events:none">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v15H6.5A2.5 2.5 0 0 0 4 21zM4 6.5V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="14" y="4" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="4" y="14" width="6" height="6" rx="1.4" fill="currentColor"/><rect x="14" y="14" width="6" height="6" rx="1.4" fill="currentColor"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.8v3M16 3.8v3M3.5 9.5h17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 19V9M12 19V5M19 19v-7" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v3a4 4 0 0 1-8 0zM9 20h6M12 15v5M6 5H4a2 2 0 0 0 2 5h1M18 5h2a2 2 0 0 1-2 5h-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16.5 19a4.5 4.5 0 0 0-9 0M12 12a3.2 3.2 0 1 0 0-6.4A3.2 3.2 0 0 0 12 12ZM19 18a3.5 3.5 0 0 0-3-3.47M17.8 11.4a2.8 2.8 0 1 0 0-5.6M5 18a3.5 3.5 0 0 1 3-3.47M6.2 11.4a2.8 2.8 0 1 1 0-5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-.9-.3a7.9 7.9 0 0 0-.6-1.5l.5-.8a1 1 0 0 0-.1-1.2l-1.4-1.4a1 1 0 0 0-1.2-.1l-.8.5c-.5-.3-1-.5-1.5-.6L13 4a1 1 0 0 0-1-.8h-2a1 1 0 0 0-1 .8l-.3.9c-.5.1-1 .3-1.5.6l-.8-.5a1 1 0 0 0-1.2.1L4 6.5a1 1 0 0 0-.1 1.2l.5.8c-.3.5-.5 1-.6 1.5L3 10.9a1 1 0 0 0-.8 1v2a1 1 0 0 0 .8 1l.9.3c.1.5.3 1 .6 1.5l-.5.8a1 1 0 0 0 .1 1.2l1.4 1.4a1 1 0 0 0 1.2.1l.8-.5c.5.3 1 .5 1.5.6l.3.9a1 1 0 0 0 1 .8h2a1 1 0 0 0 1-.8l.3-.9c.5-.1 1-.3 1.5-.6l.8.5a1 1 0 0 0 1.2-.1l1.4-1.4a1 1 0 0 0 .1-1.2l-.5-.8c.3-.5.5-1 .6-1.5l.9-.3a1 1 0 0 0 .8-1v-2a1 1 0 0 0-.8-1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.8 9.2a2.5 2.5 0 1 1 4.3 1.7c-.8.8-1.8 1.2-1.8 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.8 16.7h10.4l-1.1-1.5V10a4.1 4.1 0 1 0-8.2 0v5.2zM10 18.7a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M18 14.5A7.5 7.5 0 0 1 9.5 6a7.8 7.8 0 1 0 8.5 8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M12 4 2.5 9 12 14 21.5 9 12 4Zm-6 7.3V15c0 1.7 3 3 6 3s6-1.3 6-3v-3.7" fill="currentColor"/></symbol>
  </svg>

  <div class="dashboard-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-copy"><h1>מסלול שלי</h1><p>לומדים היום, מצליחים מחר</p></div>
        <div class="brand-mark" aria-hidden="true"><svg><use href="#i-cap"></use></svg></div>
      </div>
      <div class="sidebar-scroll">
        <div class="nav-group"><p class="nav-group-title">ראשי</p><nav class="sidebar-nav"><a class="sidebar-link active" href="/"><span class="sidebar-label">בית</span><span class="sidebar-icon"><svg><use href="#i-home"></use></svg></span></a><a class="sidebar-link" href="/courses/"><span class="sidebar-label">הקורסים שלי</span><span class="sidebar-icon"><svg><use href="#i-book"></use></svg></span></a><a class="sidebar-link" href="/courses/"><span class="sidebar-label">דשבורד</span><span class="sidebar-icon"><svg><use href="#i-grid"></use></svg></span></a><a class="sidebar-link" href="#"><span class="sidebar-label">לוח שיעורים</span><span class="sidebar-icon"><svg><use href="#i-calendar"></use></svg></span></a></nav></div>
        <div class="nav-group"><p class="nav-group-title">התקדמות</p><nav class="sidebar-nav"><a class="sidebar-link" href="#"><span class="sidebar-label">דוחות התקדמות</span><span class="sidebar-icon"><svg><use href="#i-bars"></use></svg></span></a><a class="sidebar-link" href="#"><span class="sidebar-label">הישגים ותעודות</span><span class="sidebar-icon"><svg><use href="#i-trophy"></use></svg></span></a><a class="sidebar-link" href="#"><span class="sidebar-label">קהילה</span><span class="sidebar-icon"><svg><use href="#i-users"></use></svg></span></a></nav></div>
        <div class="nav-group"><p class="nav-group-title">כלים נוספים</p><nav class="sidebar-nav"><a class="sidebar-link" href="#"><span class="sidebar-label">הגדרות</span><span class="sidebar-icon"><svg><use href="#i-settings"></use></svg></span></a><a class="sidebar-link" href="#"><span class="sidebar-label">עזרה</span><span class="sidebar-icon"><svg><use href="#i-help"></use></svg></span></a></nav></div>
      </div>
      <div class="sidebar-promo"><div class="promo-icon"><svg><use href="#i-book"></use></svg></div><h3>למידה ללא גבולות</h3><p>הידע שלך מתחיל כאן</p><div class="promo-mountains" aria-hidden="true"><span></span><span></span><span></span></div></div>
    </aside>
    <section class="main-panel">
      <header class="topbar"><div class="topbar-right"><label class="searchbar"><span class="search-icon"><svg><use href="#i-search"></use></svg></span><input type="text" placeholder="חיפוש קורסים, שיעורים או נושאים..." /></label></div><div class="topbar-left"><button class="topbar-icon" aria-label="מצב לילה" title="מעבר למצב בהיר"><svg><use href="#i-moon"></use></svg></button><button class="topbar-icon has-dot" aria-label="התראות"><svg><use href="#i-bell"></use></svg></button><div class="topbar-divider"></div><div class="profile-chip"><div class="profile-text"><strong>דניאל כהן</strong><span>תלמיד/ה</span></div><div class="avatar">ד</div><button class="caret-btn" aria-label="פתיחת תפריט"><svg><use href="#i-chevron"></use></svg></button></div></div></header>
      <main class="dashboard-canvas" aria-label="אזור תוכן ריק"></main>
    </section>
  </div>
  <script src="mobile-menu.js"></script>
  <script src="theme-toggle.js"></script>
</body>
</html>
